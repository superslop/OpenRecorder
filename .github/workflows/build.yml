name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build and test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDevelopment

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openrecorder-power-apk
          path: app/build/outputs/apk/development/*.apk
          if-no-files-found: error
